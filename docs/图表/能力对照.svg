<text x="40" y="32" class="title">和公开顶级 harness 仓比什么</text><text x="40" y="54" class="sub">对照 GameStudio / YJack 一类引擎技能堆，以及 Superpowers 一类通用编程方法论。分数是架构定位，不是下载量或评测榜。</text><text x="248" y="94" text-anchor="end" class="lab">引擎代码技能堆</text><rect x="260" y="78" width="108" height="22" rx="3" fill="#1f6feb" fill-opacity="0.9"/><text x="374" y="94" class="tick">3</text><rect x="460" y="78" width="180" height="22" rx="3" fill="#fb8f44" fill-opacity="0.9"/><text x="646" y="94" class="tick">5</text><rect x="660" y="78" width="108" height="22" rx="3" fill="#8b939c" fill-opacity="0.9"/><text x="774" y="94" class="tick">3</text><text x="248" y="138" text-anchor="end" class="lab">制作操作系统（定档/结案）</text><rect x="260" y="122" width="180" height="22" rx="3" fill="#1f6feb" fill-opacity="0.9"/><text x="446" y="138" class="tick">5</text><rect x="460" y="122" width="72" height="22" rx="3" fill="#fb8f44" fill-opacity="0.9"/><text x="538" y="138" class="tick">2</text><rect x="660" y="122" width="72" height="22" rx="3" fill="#8b939c" fill-opacity="0.9"/><text x="738" y="138" class="tick">2</text><text x="248" y="182" text-anchor="end" class="lab">写隔离 + 记录集晋升</text><rect x="260" y="166" width="180" height="22" rx="3" fill="#1f6feb" fill-opacity="0.9"/><text x="446" y="182" class="tick">5</text><rect x="460" y="166" width="72" height="22" rx="3" fill="#fb8f44" fill-opacity="0.9"/><text x="538" y="182" class="tick">2</text><rect x="660" y="166" width="36" height="22" rx="3" fill="#8b939c" fill-opacity="0.9"/><text x="702" y="182" class="tick">1</text><text x="248" y="226" text-anchor="end" class="lab">Excel / 配表生产</text><rect x="260" y="210" width="180" height="22" rx="3" fill="#1f6feb" fill-opacity="0.9"/><text x="446" y="226" class="tick">5</text><rect x="460" y="210" width="36" height="22" rx="3" fill="#fb8f44" fill-opacity="0.9"/><text x="502" y="226" class="tick">1</text><rect x="660" y="210" width="0" height="22" rx="3" fill="#8b939c" fill-opacity="0.9"/><text x="666" y="226" class="tick">