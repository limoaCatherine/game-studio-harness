<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="全流程">
  <rect width="100%" height="100%" fill="#f6f8fb"/>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 600 18px/1.3 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .sub { font: 12px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #656d76; }
    .tick, .axis { font: 11px/1.2 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #656d76; }
    .leg { font: 12px/1.2 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .lab { font: 11px/1.2 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .num { font: 700 22px/1 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .cap { font: 12px/1.3 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #656d76; }
  </style>
<text x="40" y="32" class="title">一条游戏制作流水线，而不是一堆代码技能</text><text x="40" y="54" class="sub">九段都能点到职种主路径。引擎向公开仓通常在 6 段最厚；本仓在 3 / 7 / 9 段明显更厚。</text><rect x="28" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="28" y="86" width="90" height="8" fill="url(#hero)"/><text x="36" y="122" class="leg">1 定方向</text><text x="36" y="148" class="cap">支柱</text><text x="36" y="164" class="cap">砍范围</text><text x="36" y="180" class="cap">竖切</text><rect x="126" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="126" y="86" width="90" height="8" fill="url(#hero)"/><text x="134" y="122" class="leg">2 定规则</text><text x="134" y="148" class="cap">系统索引</text><text x="134" y="164" class="cap">GDD</text><text x="134" y="180" class="cap">可行性</text><rect x="224" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="224" y="86" width="90" height="8" fill="url(#hero)"/><text x="232" y="122" class="leg">3 定数字</text><text x="232" y="148" class="cap">属性</text><text x="232" y="164" class="cap">公式</text><text x="232" y="180" class="cap">物价</text><text x="232" y="196" class="cap">成长</text><rect x="322" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="322" y="86" width="90" height="8" fill="url(#hero)"/><text x="330" y="122" class="leg">4 定体验</text><text x="330" y="148" class="cap">关卡</text><text x="330" y="164" class="cap">叙事</text><text x="330" y="180" class="cap">UX</text><text x="330" y="196" class="cap">文案</text><rect x="420" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="420" y="86" width="90" height="8" fill="url(#hero)"/><text x="428" y="122" class="leg">5 出资产</text><text x="428" y="148" class="cap">原画</text><text x="428" y="164" class="cap">模型</text><text x="428" y="180" class="cap">绑定</text><text x="428" y="196" class="cap">动画</text><text x="428" y="212" class="cap">特效</text><text x="428" y="228" class="cap">音频</text><rect x="518" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="518" y="86" width="90" height="8" fill="url(#hero)"/><text x="526" y="122" class="leg">6 进引擎</text><text x="526" y="148" class="cap">导入</text><text x="526" y="164" class="cap">LOD</text><text x="526" y="180" class="cap">Shader</text><text x="526" y="196" class="cap">帧同步</text><rect x="616" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="616" y="86" width="90" height="8" fill="url(#hero)"/><text x="624" y="122" class="leg">7 上权威</text><text x="624" y="148" class="cap">服务端结算</text><text x="624" y="164" class="cap">反作弊</text><text x="624" y="180" class="cap">存档</text><rect x="714" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="714" y="86" width="90" height="8" fill="url(#hero)"/><text x="722" y="122" class="leg">8 能验收</text><text x="722" y="148" class="cap">用例</text><text x="722" y="164" class="cap">兼容</text><text x="722" y="180" class="cap">性能</text><text x="722" y="196" class="cap">发版</text><rect x="812" y="86" width="90" height="170" rx="8" fill="#fff" stroke="#1f6feb"/><rect x="812" y="86" width="90" height="8" fill="url(#hero)"/><text x="820" y="122" class="leg">9 能运营</text><text x="820" y="148" class="cap">活动</text><text x="820" y="164" class="cap">邮件</text><text x="820" y="180" class="cap">商业化 KPI</text></svg>
