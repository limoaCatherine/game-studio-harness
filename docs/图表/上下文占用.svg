ill="none" stroke="#1f6feb" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="72.0,313.6 176.0,305.4 280.0,297.2 384.0,289.0 488.0,280.8 592.0,272.5 696.0,264.3 800.0,256.1"/><rect x="72" y="388" width="14" height="3" fill="#cf222e"/><text x="92" y="393" class="leg">全量灌入技能/职种/外接</text><rect x="282" y="388" width="14" height="3" fill="#1f6feb"/><text x="302" y="393" class="leg">本架构：只注入点名正文</text></svg>
