<text x="40" y="32" class="title">上下文注入漏斗</text><text x="40" y="54" class="sub">名单决定开场先读谁，不是调用闸。过程中仍可打开未点名的技能，只是不预交税。</text><rect x="40.0" y="78" width="760" height="52" rx="6" fill="#d0d7de"/><text x="420" y="100" text-anchor="middle" class="leg" fill="#1f2328">菜单全集</text><text x="420" y="118" text-anchor="middle" class="cap" fill="#1f2328">106 技能 · 35 职种 · 36 外接</text><rect x="110.0" y="138" width="620" height="52" rx="6" fill="#8b939c"/><text x="420" y="160" text-anchor="middle" class="leg" fill="#1f2328">第二层点名</text><text x="420" y="178" text-anchor="middle" class="cap" fill="#1f2328">只把本轮 id 写入计划</text><rect x="180.0" y="198" width="480" height="52" rx="6" fill="#8250df"/><text x="420" y="220" text-anchor="middle" class="leg" fill="#ffffff">activated.json</text><text x="420" y="238" text-anchor="middle" class="cap" fill="#ffffff">职种不预展开，只留 craft_open</text><rect x="250.0" y="258" width="340" height="52" rx="6" fill="#1f6feb"/><text x="420" y="280" text-anchor="middle" class="leg" fill="#ffffff">开场注入</text><text x="420" y="298" text-anchor="middle" class="cap" fill="#ffffff">宪法 + 现行卡 + 点名正文</text><rect x="310.0" y="318" width="220" height="52" rx="6" fill="#1a7f37"/><text x="420" y="340" text-anchor="middle" class="leg" fill="#ffffff">记忆按键</text><text x="420" y="358" text-anchor="middle" class="cap" fill="#ffffff">retrieve_keys 命中的 canon / adr</text><rect x="340.0" y="378" width="160" height="52" rx="6" fill="#bf3989"/><text x="420" y="400" text-anchor="middle" class="leg" fill="#ffffff">制作中按步打开</text><text x="420" y="418" text-anchor="middle" class="cap" fill="#ffffff">路径下一步 · 当场调用的外接</text></svg>
