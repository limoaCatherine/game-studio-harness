<text x="72" y="28" class="title">正式面误写累积风险（示意模型）</text><text x="72" y="48" class="sub">直接改正式面随会话叠加；隔离根默认写、人准后只回写记录集，风险接近持平。</text><line x1="72" y1="352.0" x2="800" y2="352.0" stroke="#e6e8eb" stroke-width="1"/><text x="62" y="356.0" text-anchor="end" class="tick">0</text><line x1="72" y1="283.5" x2="800" y2="283.5" stroke="#e6e8eb" stroke-width="1"/><text x="62" y="287.5" text-anchor="end" class="tick">3</text><line x1="72" y1="215.0" x2="800" y2="215.0" stroke="#e6e8eb" stroke-width="1"/><text x="62" y="219.0" text-anchor="end" class="tick">6</text><line x1="72" y1="146.5" x2="800" y2="146.5" stroke="#e6e8eb" stroke-width="1"/><text x="62" y="150.5" text-anchor="end" class="tick">9</text><line x1="72" y1="78.0" x2="800" y2="78.0" stroke="#e6e8eb" stroke-width="1"/><text x="62" y="82.0" text-anchor="end" class="tick">12</text><line x1="72" y1="78" x2="72" y2="352" stroke="#8b939c"/><line x1="72" y1="352" x2="800" y2="352" stroke="#8b939c"/><line x1="72.0" y1="352" x2="72.0" y2="358" stroke="#8b939c"/><text x="72.0" y="374" text-anchor="middle" class="tick">1</text><line x1="254.0" y1="352" x2="254.0" y2="358" stroke="#8b939c"/><text x="254.0" y="374" text-anchor="middle" class="tick">2.25</text><line x1="436.0" y1="352" x2="436.0" y2="358" stroke="#8b939c"/><text x="436.0" y="374" text-anchor="middle" class="tick">3.5</text><line x1="618.0" y1="352" x2="618.0" y2="358" stroke="#8b939c"/><text x="618.0" y="374" text-anchor="middle" class="tick">4.75</text><line x1="800.0" y1="352" x2="800.0" y2="358" stroke="#8b939c"/><text x="800.0" y="374" text-anchor="middle" class="tick">6</text><text x="24" y="215" transform="rotate(-90 24 215)" text-anchor="middle" class="axis">不可逆误写相对风险</text><text x="436" y="378" text-anchor="middle" class="axis">并行会话数</text><polyline fill="none" stroke="#cf222e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="72.0,329.2 217.6,299.5 363.2,260.7 508.8,210.4 654.4,151.1 800.0,89.4"/><polyline fill="none" stroke="#8250df" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="72.0,345.1 217.6,342.9 363.2,340.6 508.8,339.4 654.4,338.3 800.0,337.2"/><rect x="72" y="388" width="14" height="3" fill="#cf222e"/><text x="92" y="393" class="leg">代理直接写正式面</text><rect x="282" y="388" width="14" height="3" fill="#8250df"/><text x="302" y="393" class="leg">沙盒默认 + 记录集晋升</text></svg>
