<text x="264.4000000000001" y="-48.4" font-size="24" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">四层各管一件事</text>
<text x="41.75" y="26.25" font-size="15" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">层</text>
<text x="205.75000000000003" y="26.25" font-size="15" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">只回答</text>
<text x="420.55000000000007" y="26.25" font-size="15" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">不回答</text>
<text x="596.8500000000001" y="26.25" font-size="15" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">若缺席</text>
<text x="34.599999999999994" y="64.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">宪法</text>
<text x="161.20000000000002" y="64.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">每轮都不能忘的运转</text>
<text x="383.70000000000005" y="64.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">这件事具体怎么做</text>
<text x="544.6000000000001" y="64.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">窗口被菜单和做法填满</text>
<text x="34.599999999999994" y="100.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">定档</text>
<text x="122.7" y="100.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">这一轮点谁、写到哪、怎么收口</text>
<text x="391.40000000000003" y="100.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">伤害公式怎么写</text>
<text x="544.6000000000001" y="100.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">相关性靠猜，多岗串演</text>
<text x="26.9" y="136.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">能力库</text>
<text x="153.5" y="136.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">可复用做法与岗位路径</text>
<text x="376.00000000000006" y="136.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">当次数字、当次路径</text>
<text x="560.0000000000001" y="136.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">每轮读完全部技能</text>
<text x="26.9" y="172.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">档案柜</text>
<text x="115.0" y="172.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">做到哪、正式面在哪、哪句已批准</text>
<text x="376.00000000000006" y="172.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">自动推理上次为什么</text>
<text x="567.7000000000002" y="172.9" font-size="14" fill="#1e1e1e" text-anchor="start" opacity="1.0" font-family="Arial, sans-serif">换窗口后丢进度</text>
