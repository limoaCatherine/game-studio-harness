name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable)
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Isolate verify
        shell: bash
        run: |
          probe="${RUNNER_TEMP}/gsh-probe"
          python -m gsh setup --isolate-root "$probe" --workspace "$probe/ws" --tools all --profile full --yes
          python -m gsh verify --isolate-root "$probe" --workspace "$probe/ws"
          python -m gsh menu --kind craft -q ttk
      - name: Ruff (advisory)
        continue-on-error: true
        run: python -m ruff check gsh tests

  pack:
    name: wheel install from empty cwd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel away from the checkout
        run: |
          python -m venv /tmp/gsh-wheel
          /tmp/gsh-wheel/bin/pip install dist/*.whl
          mkdir -p /tmp/empty-cwd
          cd /tmp/empty-cwd
          /tmp/gsh-wheel/bin/gsh --version
          probe=/tmp/gsh-wheel-probe
          /tmp/gsh-wheel/bin/gsh setup --isolate-root "$probe" --workspace "$probe/ws" --tools all --profile full --yes
          /tmp/gsh-wheel/bin/gsh verify --isolate-root "$probe" --workspace "$probe/ws"
